<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0F" />
      <stop offset="55%" stop-color="#0D0E13" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>

    <pattern id="dot-matrix" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#FFFFFF" fill-opacity="0.045" />
    </pattern>

    <radialGradient id="glow-red" cx="0%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#E2231A" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#E2231A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-stage" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2D3E" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#14151D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A0B0F" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="frame-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#E2231A" stop-opacity="0.28" />
    </linearGradient>

    <linearGradient id="red-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4A3F" />
      <stop offset="100%" stop-color="#C81E16" />
    </linearGradient>

    <linearGradient id="title-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B4B8C4" />
    </linearGradient>

    <linearGradient id="chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23242D" />
      <stop offset="45%" stop-color="#16171E" />
      <stop offset="100%" stop-color="#0E0F14" />
    </linearGradient>
    <linearGradient id="chassis-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A2C37" stop-opacity="1" />
      <stop offset="100%" stop-color="#2A2C37" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="reflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="led-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-40%" width="140%" height="220%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="blur" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#canvas-bg)" />
  <rect width="1200" height="400" rx="16" fill="url(#dot-matrix)" />
  <rect width="1200" height="400" rx="16" fill="url(#glow-red)" />
  <ellipse cx="910" cy="205" rx="330" ry="170" fill="url(#glow-stage)" />
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="url(#frame-stroke)" stroke-width="1.2" />

  <!-- LEFT COLUMN (content spans x 64 to ~500) -->

  <!-- Model tag -->
  <g transform="translate(64, 56)">
    <rect x="0" y="0" width="3" height="16" rx="1.5" fill="url(#red-bar)" />
    <text x="14" y="12.5" fill="#E2231A" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="3">THINKCENTRE M910X TINY</text>
  </g>

  <!-- Title -->
  <text x="64" y="124" fill="url(#title-fill)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="46" font-weight="700" letter-spacing="-1.2">macOS Monterey<tspan dx="16" fill="#6B7280" font-size="26" font-weight="300" letter-spacing="0">12.7.6</tspan></text>

  <!-- Subtitle -->
  <text x="64" y="158" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="400" letter-spacing="-0.1">Production OpenCore 1.0.8 EFI  ·  Intel Core i5-6500T</text>

  <!-- Spec chips: 2 x 2 grid -->
  <g transform="translate(64, 192)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif">
    <!-- Graphics -->
    <g>
      <rect x="0.5" y="0.5" width="214" height="46" rx="9" fill="#12131A" stroke="#242530" />
      <circle cx="20" cy="23.5" r="3.5" fill="#10B981" />
      <text x="36" y="19" fill="#6B7280" font-size="9" font-weight="600" letter-spacing="1.8">GRAPHICS</text>
      <text x="36" y="36" fill="#F4F4F5" font-size="13.5" font-weight="600">HD 530 · 1536 MB</text>
    </g>
    <!-- Audio -->
    <g transform="translate(228, 0)">
      <rect x="0.5" y="0.5" width="214" height="46" rx="9" fill="#12131A" stroke="#242530" />
      <circle cx="20" cy="23.5" r="3.5" fill="#38BDF8" />
      <text x="36" y="19" fill="#6B7280" font-size="9" font-weight="600" letter-spacing="1.8">AUDIO</text>
      <text x="36" y="36" fill="#F4F4F5" font-size="13.5" font-weight="600">ALC294 · Layout 12</text>
    </g>
    <!-- Ethernet -->
    <g transform="translate(0, 58)">
      <rect x="0.5" y="0.5" width="214" height="46" rx="9" fill="#12131A" stroke="#242530" />
      <circle cx="20" cy="23.5" r="3.5" fill="#60A5FA" />
      <text x="36" y="19" fill="#6B7280" font-size="9" font-weight="600" letter-spacing="1.8">ETHERNET</text>
      <text x="36" y="36" fill="#F4F4F5" font-size="13.5" font-weight="600">Intel I219-LM 1GbE</text>
    </g>
    <!-- Wireless -->
    <g transform="translate(228, 58)">
      <rect x="0.5" y="0.5" width="214" height="46" rx="9" fill="#12131A" stroke="#242530" />
      <circle cx="20" cy="23.5" r="3.5" fill="#A78BFA" />
      <text x="36" y="19" fill="#6B7280" font-size="9" font-weight="600" letter-spacing="1.8">WIRELESS</text>
      <text x="36" y="36" fill="#F4F4F5" font-size="13.5" font-weight="600">Intel AC 8265 Wi-Fi</text>
    </g>
  </g>

  <!-- Footer metadata -->
  <g transform="translate(64, 326)">
    <line x1="0" y1="0" x2="442" y2="0" stroke="url(#hairline)" stroke-width="1" />
    <text x="0" y="26" fill="#6B7280" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="10.5" font-weight="500" letter-spacing="1.2">SKYLAKE 35W  ·  DP-TO-HDMI  ·  APFS TRIM</text>
  </g>

  <!-- RIGHT COLUMN: device front view (x 690 to 1130) -->

  <!-- Floor glow + reflection -->
  <ellipse cx="910" cy="268" rx="190" ry="9" fill="#E2231A" fill-opacity="0.22" filter="url(#blur)" />
  <rect x="700" y="254" width="420" height="30" rx="10" fill="url(#reflection)" />

  <!-- Chassis -->
  <g transform="translate(690, 150)">
    <rect x="0" y="0" width="440" height="104" rx="14" fill="url(#chassis)" stroke="#2C2E39" stroke-width="1.2" filter="url(#shadow)" />
    <rect x="24" y="0.8" width="392" height="1.2" fill="url(#chassis-edge)" />
    <rect x="1" y="94" width="438" height="9" rx="8" fill="#000000" fill-opacity="0.25" />

    <!-- Wordmark -->
    <rect x="32" y="26" width="3" height="14" rx="1.5" fill="url(#red-bar)" />
    <text x="44" y="38" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ThinkCentre</text>

    <!-- Ports -->
    <g transform="translate(32, 62)">
      <rect x="0" y="0" width="34" height="16" rx="3.5" fill="#0B0C10" stroke="#30323D" />
      <rect x="6" y="5.5" width="22" height="5" rx="1" fill="#0284C7" fill-opacity="0.85" />
      <rect x="46" y="0" width="34" height="16" rx="3.5" fill="#0B0C10" stroke="#30323D" />
      <rect x="52" y="5.5" width="22" height="5" rx="1" fill="#E2231A" fill-opacity="0.85" />
      <circle cx="104" cy="8" r="8" fill="#0B0C10" stroke="#30323D" />
      <circle cx="104" cy="8" r="3.2" fill="#10B981" />
      <circle cx="132" cy="8" r="8" fill="#0B0C10" stroke="#30323D" />
      <circle cx="132" cy="8" r="3.2" fill="#3F3F46" />
    </g>

    <!-- Intake vents -->
    <g fill="#0B0C10" stroke="#23242D" stroke-width="0.8">
      <rect x="216" y="26" width="4" height="52" rx="2" />
      <rect x="228" y="26" width="4" height="52" rx="2" />
      <rect x="240" y="26" width="4" height="52" rx="2" />
      <rect x="252" y="26" width="4" height="52" rx="2" />
      <rect x="264" y="26" width="4" height="52" rx="2" />
      <rect x="276" y="26" width="4" height="52" rx="2" />
      <rect x="288" y="26" width="4" height="52" rx="2" />
      <rect x="300" y="26" width="4" height="52" rx="2" />
      <rect x="312" y="26" width="4" height="52" rx="2" />
      <rect x="324" y="26" width="4" height="52" rx="2" />
    </g>

    <!-- Power button -->
    <circle cx="396" cy="52" r="26" fill="url(#led-glow)" fill-opacity="0.25" />
    <circle cx="396" cy="52" r="15" fill="#101117" stroke="#34364A" stroke-width="1.2" />
    <circle cx="396" cy="52" r="9" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.9" />
    <line x1="396" y1="45" x2="396" y2="52" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- Dimension line + label -->
  <g transform="translate(0, 306)">
    <line x1="690" y1="0" x2="786" y2="0" stroke="#2A2C37" stroke-width="1" />
    <line x1="1034" y1="0" x2="1130" y2="0" stroke="#2A2C37" stroke-width="1" />
    <line x1="690" y1="-4" x2="690" y2="4" stroke="#2A2C37" stroke-width="1" />
    <line x1="1130" y1="-4" x2="1130" y2="4" stroke="#2A2C37" stroke-width="1" />
    <text x="910" y="3.5" text-anchor="middle" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="9.5" font-weight="600" letter-spacing="2">1.0L ULTRA SMALL FORM FACTOR</text>
  </g>
</svg>
