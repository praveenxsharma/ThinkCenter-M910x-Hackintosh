<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Matte Gradient Background -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0D" />
      <stop offset="60%" stop-color="#0C0D11" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Refined Minimal Grid Pattern -->
    <pattern id="dot-matrix" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#FFFFFF" fill-opacity="0.05" />
    </pattern>

    <!-- Subtle Ambient Corner Glow -->
    <radialGradient id="top-left-glow" cx="0%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#E2231A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#E2231A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="top-right-glow" cx="100%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Border highlight -->
    <linearGradient id="frame-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#E2231A" stop-opacity="0.25" />
    </linearGradient>

    <!-- Red Accent -->
    <linearGradient id="red-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#E2231A" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#canvas-bg)" />
  <rect width="1200" height="400" rx="16" fill="url(#dot-matrix)" />
  <rect width="1200" height="400" rx="16" fill="url(#top-left-glow)" />
  <rect width="1200" height="400" rx="16" fill="url(#top-right-glow)" />
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="url(#frame-stroke)" stroke-width="1.2" />

  <!-- LEFT COLUMN: Typography & Specifications -->

  <!-- Model Tag -->
  <g transform="translate(64, 56)">
    <rect x="0" y="0" width="3" height="16" rx="1.5" fill="url(#red-gradient)" />
    <text x="12" y="13" fill="#E2231A" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">
      THINKCENTRE M910X TINY
    </text>
  </g>

  <!-- Title using tspan for guaranteed collision-free flow -->
  <text x="64" y="132" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    macOS Monterey<tspan dx="14" fill="#71717A" font-size="28" font-weight="300" letter-spacing="0">12.7.6</tspan>
  </text>

  <!-- Subtitle -->
  <text x="64" y="174" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2">
    Production OpenCore 1.0.8 EFI · Intel Core i5-6500T · Full Metal Acceleration
  </text>

  <!-- Spec Chips Row (Comfortable spacing & no cramped boxes) -->
  <g transform="translate(64, 216)">
    <!-- Chip 1: Graphics -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="158" height="34" rx="7" fill="#13141B" stroke="#22232B" stroke-width="1" />
      <circle cx="16" cy="17" r="3.5" fill="#10B981" />
      <text x="28" y="22" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="600">HD 530 1536 MB</text>
    </g>

    <!-- Chip 2: Audio -->
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="158" height="34" rx="7" fill="#13141B" stroke="#22232B" stroke-width="1" />
      <circle cx="16" cy="17" r="3.5" fill="#38BDF8" />
      <text x="28" y="22" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="600">ALC294 (Layout 12)</text>
    </g>

    <!-- Chip 3: Ethernet -->
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="168" height="34" rx="7" fill="#13141B" stroke="#22232B" stroke-width="1" />
      <circle cx="16" cy="17" r="3.5" fill="#60A5FA" />
      <text x="28" y="22" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="600">Intel I219-LM 1GbE</text>
    </g>

    <!-- Chip 4: Wireless -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="152" height="34" rx="7" fill="#13141B" stroke="#22232B" stroke-width="1" />
      <circle cx="16" cy="17" r="3.5" fill="#A78BFA" />
      <text x="28" y="22" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="600">Intel AC 8265 Wi-Fi</text>
    </g>
  </g>

  <!-- Technical Footer Metadata - Single Line to Prevent Collisions -->
  <g transform="translate(64, 320)">
    <line x1="0" y1="0" x2="608" y2="0" stroke="#1F2028" stroke-width="1" />
    <text x="0" y="24" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', monospace" font-size="11.5" font-weight="500" letter-spacing="0.5">
      SKYLAKE DESKTOP 35W  <tspan fill="#334155">·</tspan>  OPENCORE 1.0.8  <tspan fill="#334155">·</tspan>  DP-TO-HDMI  <tspan fill="#334155">·</tspan>  APFS TRIM NATIVE
    </text>
  </g>

  <!-- RIGHT COLUMN: Minimal Precision Hardware Schematic -->
  <g transform="translate(760, 68)">
    <!-- Subtle Chassis Base -->
    <rect x="0" y="0" width="376" height="264" rx="12" fill="#0D0E13" stroke="#22232A" stroke-width="1.2" />

    <!-- ThinkCentre Logo Accent -->
    <text x="32" y="44" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" letter-spacing="1">
      ThinkCentre
    </text>
    <!-- Glowing Red Dot on the 'i' of ThinkCentre -->
    <circle cx="68" cy="33" r="2.5" fill="#E2231A" />
    <circle cx="68" cy="33" r="5.5" fill="#E2231A" fill-opacity="0.3" />

    <!-- Power Button Indicator -->
    <rect x="306" y="28" width="38" height="22" rx="11" fill="#14151C" stroke="#2E303B" stroke-width="1" />
    <circle cx="325" cy="39" r="3" fill="#38BDF8" />

    <!-- Front I/O Ports Schematic -->
    <g transform="translate(32, 78)">
      <!-- USB Port 1 -->
      <rect x="0" y="0" width="32" height="15" rx="3" fill="#181922" stroke="#2E303B" stroke-width="1" />
      <rect x="7" y="5" width="18" height="5" rx="1" fill="#0284C7" fill-opacity="0.8" />

      <!-- USB Port 2 (Fast Charge) -->
      <rect x="44" y="0" width="32" height="15" rx="3" fill="#181922" stroke="#2E303B" stroke-width="1" />
      <rect x="51" y="5" width="18" height="5" rx="1" fill="#E2231A" fill-opacity="0.8" />

      <!-- Headphone / Combo Audio Jack (ALC294) -->
      <circle cx="100" cy="7.5" r="7.5" fill="#181922" stroke="#2E303B" stroke-width="1" />
      <circle cx="100" cy="7.5" r="3.5" fill="#10B981" />

      <!-- Mic Jack -->
      <circle cx="126" cy="7.5" r="7.5" fill="#181922" stroke="#2E303B" stroke-width="1" />
      <circle cx="126" cy="7.5" r="3.5" fill="#3F3F46" />
    </g>

    <!-- Geometric Intake Grille -->
    <g fill="#191A23" transform="translate(32, 126)">
      <rect x="0" y="0" width="312" height="3" rx="1.5" />
      <rect x="0" y="12" width="312" height="3" rx="1.5" />
      <rect x="0" y="24" width="312" height="3" rx="1.5" />
      <rect x="0" y="36" width="312" height="3" rx="1.5" />
      <rect x="0" y="48" width="312" height="3" rx="1.5" />
      <rect x="0" y="60" width="312" height="3" rx="1.5" />
      <rect x="0" y="72" width="312" height="3" rx="1.5" />
    </g>

    <!-- Bottom Badge - Fully Within Frame Boundaries -->
    <g transform="translate(32, 224)">
      <text x="0" y="12" fill="#52525B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5">
        1.0L ULTRA SMALL FORM FACTOR
      </text>
    </g>
  </g>
</svg>
